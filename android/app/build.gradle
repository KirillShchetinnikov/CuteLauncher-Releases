plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

// Release distribution builds ARM universal and a separate x64 APK in two passes.
if (!project.hasProperty('target-platform')) {
    project.ext.set('target-platform', 'android-arm,android-arm64,android-x64')
}

def requestedAbis = project.property('target-platform').split(',').collect {
    ['android-arm': 'armeabi-v7a', 'android-arm64': 'arm64-v8a', 'android-x64': 'x86_64'][it]
}.findAll { it != null }
def splitPerAbi = project.findProperty('split-per-abi')?.toString()?.toBoolean() ?: false
// A multi-ABI universal release is ARM-only. x64 remains available as a split
// or an explicitly requested single-ABI diagnostic build.
def releaseAbis = splitPerAbi || requestedAbis.size() == 1
    ? requestedAbis : requestedAbis.findAll { it != 'x86_64' }

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def secretProperties = new Properties()
secretProperties.setProperty("signing_keystore_password", "${System.getenv('FLAUNCHER_KEYSTORE_PASSWORD')}")
secretProperties.setProperty("signing_key_password", "${System.getenv('FLAUNCHER_SIGNING_KEY_PASSWORD')}")
secretProperties.setProperty("signing_key_alias", "${System.getenv('FLAUNCHER_SIGNING_KEY_ALIAS')}")

def keystoreFilePath = System.getenv("KEYSTORE_FILE") ?: localProperties['storeFile']
def hasKeystore = keystoreFilePath != null && file(keystoreFilePath).exists()

def geoNamesDefine = project.findProperty('dart-defines')?.toString()?.split(',')?.collect {
    new String(it.decodeBase64(), 'UTF-8')
}?.find { it.startsWith('GEONAMES_USERNAME=') }
def geoNamesUsername = geoNamesDefine == null ? 'kipik1' : geoNamesDefine.substring('GEONAMES_USERNAME='.length())

android {
    compileSdk 36
    ndkVersion "28.2.13676358"
    buildFeatures {
        buildConfig true
        resValues true
    }
    // Opt in to a same-signature hardware probe; regular builds are unaffected.
    if (project.hasProperty('tv-instrumentation')) {
        testBuildType project.findProperty('tv-test-build-type') ?: "release"
        defaultConfig.testInstrumentationRunner project.findProperty('tv-probe-runner') ?: "com.leanbitlab.ltvL.tests.NightNotificationProbe"
    }
    dependenciesInfo {
        // Disables dependency metadata when building APKs (for IzzyOnDroid/F-Droid)
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles (for Google Play)
        includeInBundle = false
    }

    defaultConfig {
        buildConfigField "String", "GEONAMES_USERNAME", groovy.json.JsonOutput.toJson(geoNamesUsername)
        applicationId "io.github.kirillshchetinnikov.cutelauncher"
        resValue "string", "screensaver_settings_activity", "io.github.kirillshchetinnikov.cutelauncher/com.leanbitlab.ltvL.MainActivity"
        minSdk 28
        targetSdk 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        debug {}
        release {
            if (hasKeystore) {
                storeFile file(keystoreFilePath)
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: localProperties['storePassword']
                keyAlias System.getenv("KEY_ALIAS") ?: localProperties['keyAlias']
                keyPassword System.getenv("KEY_PASSWORD") ?: localProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            resValue "string", "screensaver_settings_activity", "io.github.kirillshchetinnikov.cutelauncher.debug/com.leanbitlab.ltvL.MainActivity"
            signingConfig signingConfigs.debug
            ndk {
                if (!splitPerAbi) abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
            }
        }
        profile {
            // Allow a local profile APK to update the signed release for measurement.
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
            ndk {
                if (!splitPerAbi) abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
            }
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
            ndk {
                abiFilters.clear()
                if (!splitPerAbi) abiFilters.addAll(releaseAbis)
            }
        }
    }

    splits {
        abi {
            // https://stackoverflow.com/a/39950584/21037183
            enable gradle.startParameter.taskNames.any { it.contains("assembleRelease") } && System.getenv("UNIVERSAL_ONLY") != "true"
            reset()
            include(*releaseAbis)
            universalApk !splitPerAbi
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    testOptions {
        unitTests.includeAndroidResources = true
        // Robolectric 4.17 reflects into these modules on JDK 17+.
        unitTests.all {
            jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED',
                '--add-opens=java.base/java.util=ALL-UNNAMED',
                '--add-opens=java.base/java.io=ALL-UNNAMED',
                '--add-opens=java.base/java.net=ALL-UNNAMED',
                '--add-opens=java.base/java.security=ALL-UNNAMED',
                '--add-opens=java.base/java.text=ALL-UNNAMED',
                '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED',
                '--add-opens=java.desktop/java.awt.font=ALL-UNNAMED',
                '--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED'
        }
    }

    namespace 'com.leanbitlab.ltvL'
}

androidComponents {
    onVariants(selector().all()) { variant ->
        // Flutter's asset copy task is not wired to AGP 9 host-test packaging.
        def variantTaskSuffix = variant.name.capitalize()
        tasks.matching { it.name == "package${variantTaskSuffix}UnitTestForUnitTest" }.configureEach {
            dependsOn "copyFlutterAssets${variantTaskSuffix}"
        }
        variant.outputs.each { output ->
            def abi = output.filters.find {
                it.filterType == com.android.build.api.variant.FilterConfiguration.FilterType.ABI
            }?.identifier
            if (abi == null && variant.buildType == 'release' && releaseAbis == ['x86_64']) {
                abi = 'x86_64'
            }
            output.outputFileName.set(output.versionName.map { version ->
                "CuteLauncher-${version}-${abi ?: 'universal'}-${variant.buildType}.apk"
            })
        }
    }
    onVariants(selector().withBuildType('release')) { variant ->
        // Compress release downloads; false is available for size comparisons.
        variant.packaging.jniLibs.useLegacyPackaging.set(
            providers.environmentVariable('CUTE_COMPRESS_NATIVE_LIBRARIES')
                .map { it.toBoolean() }.orElse(true))
        // Flutter no longer supports 32-bit x86, even if AARs contain those libs.
        variant.packaging.jniLibs.excludes.add('lib/x86/**')
        // Flutter's defaultConfig filters merge with buildType filters. Exclude
        // unrequested AAR/native-hook ABIs explicitly from the universal output.
        ['armeabi-v7a', 'arm64-v8a', 'x86_64'].findAll { !releaseAbis.contains(it) }.each { abi ->
            variant.packaging.jniLibs.excludes.add("lib/${abi}/**")
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'com.android.tools.build:apksig:9.5.0'
    implementation 'androidx.work:work-runtime:2.12.0'
    implementation 'dev.mobile:dadb:2.0.0'
    implementation 'com.hierynomus:smbj:0.15.0'
    runtimeOnly 'org.slf4j:slf4j-nop:2.0.18'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'androidx.work:work-testing:2.12.0'
}
