allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url 'https://jitpack.io'
            content { includeGroup 'com.github.MuntashirAkon'; includeGroup 'com.github.MuntashirAkon.spake2-java' }
        }
    }
}

rootProject.layout.buildDirectory.set(rootProject.file('../build'))
subprojects {
    project.layout.buildDirectory.set(rootProject.layout.buildDirectory.dir(project.name))
    // AGP 9 validates compileSdk across Flutter plugin dependencies.
    project.plugins.withId('com.android.library') {
        project.extensions.getByName('androidComponents').finalizeDsl { library ->
            library.compileSdk = 36
        }
    }
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
