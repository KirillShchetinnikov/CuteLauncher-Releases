org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m
org.gradle.vfs.watch=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
android.useAndroidX=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
android.enableR8.fullMode=true
# Preserve resource shrinking behavior with the existing final resource IDs.
android.r8.optimizedResourceShrinking=false
# All Android plugins support AGP 9 built-in Kotlin.
android.builtInKotlin=true
# Flutter 3.47.6 still casts the Android extension to AbstractAppExtension.
# Keep the opt-out until its Gradle plugin supports the public DSL.
android.newDsl=false
