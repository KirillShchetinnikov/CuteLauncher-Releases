name: flauncher
description: CuteLauncher, a personal Android TV launcher based on LTvLauncher.

version: 1.5.1+131

environment:
  sdk: ">=3.13.5 <4.0.0"
  flutter: 3.47.6

dependencies:
  flutter:
    sdk: flutter

  image_picker: ^1.2.4
  intl: any
  crypto: 3.0.7
  xml: 7.1.0 # Bounded WebDAV multistatus parsing; already resolved by tooling.
  drift: 2.35.1
  path: ^1.9.0
  path_provider: ^2.1.6
  package_info_plus: ^10.2.2
  provider: ^6.0.5
  shared_preferences: ^2.5.6
  # First Android implementation migrated to built-in Kotlin (AGP 9).
  shared_preferences_android: 2.4.28
  screen_brightness: 2.1.11
  flutter_localizations:
    sdk: flutter
  pool: ^1.5.2
  qr_flutter: ^4.1.0

  collection: any
  video_player: ^2.14.1
dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: 2.16.1
  flutter_lints: ^6.0.0
  mockito: 5.8.1
  drift_dev: 2.35.1
  network_image_mock: ^2.1.1
  transparent_image: ^2.0.1

  shared_preferences_platform_interface: any
  path_provider_platform_interface: any
  plugin_platform_interface: any
  package_info_plus_platform_interface: any
  flutter_launcher_icons: ^0.14.4

  sqlite3: 3.7.0
  fake_async: any
  video_player_platform_interface: any
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  min_sdk_android: 28
  image_path: "assets/icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon-foreground.png"
  adaptive_icon_foreground_inset: 0 # Artwork already has its safe-zone inset.
flutter:
  generate: true
  uses-material-design: true
  assets:
    - catalog/app_descriptions.json
    - catalog/cleaner_profiles.json
    - assets/icon.png
    - assets/licenses/android_runtime.txt
    - docs/DADB_LICENSE.txt
    - assets/fonts/LICENSE_medeo.txt
    - assets/fonts/AUTHORS_medeo.txt
    - assets/fonts/LICENSE_roboto.txt
    - assets/fonts/LICENSE_notoserif.txt
    - assets/fonts/LICENSE_robotomono.txt
    - assets/fonts/LICENSE_robotocondensed.txt
    - assets/fonts/LICENSE_outfit.txt
    - assets/fonts/LICENSE_manrope.txt
    - assets/fonts/LICENSE_onest.txt
    - assets/fonts/LICENSE_googlesans.txt
    - assets/fonts/TRADEMARKS_googlesans.txt
    - assets/landscapes/
  fonts:
    - family: Medeo Sans
      fonts:
        - asset: assets/fonts/medeo-sans.ttf
        - asset: assets/fonts/medeo-sans-italic.ttf
          style: italic
    - family: Medeo Mono
      fonts:
        - asset: assets/fonts/medeo-mono.ttf
        - asset: assets/fonts/medeo-mono-italic.ttf
          style: italic
    - family: Outfit
      fonts:
        - asset: assets/fonts/outfit.ttf
    - family: Google Sans
      fonts:
        - asset: assets/fonts/googlesans-400.ttf
          weight: 400
        - asset: assets/fonts/googlesans-500.ttf
          weight: 500
        - asset: assets/fonts/googlesans-600.ttf
          weight: 600
        - asset: assets/fonts/googlesans-700.ttf
          weight: 700
    - family: Onest
      fonts:
        - asset: assets/fonts/onest.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope.ttf
    - family: PanelSans
      fonts:
        - asset: assets/fonts/sans.ttf
    - family: PanelSerif
      fonts:
        - asset: assets/fonts/serif.ttf
    - family: PanelMono
      fonts:
        - asset: assets/fonts/mono.ttf
    - family: PanelCondensed
      fonts:
        - asset: assets/fonts/condensed.ttf
