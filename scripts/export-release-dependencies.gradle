import groovy.json.JsonOutput

// Read-only inventory of the actual release graph; source artifacts are optional.
gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    if (app == null) return
    app.tasks.register('exportReleaseDependencies') {
        doLast {
            def output = new File(app.rootProject.projectDir.parentFile, '.local/release-dependencies.json')
            output.parentFile.mkdirs()
            def entries = app.configurations.releaseRuntimeClasspath.incoming.resolutionResult.allComponents
                .findAll { it.id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
                .collect { component ->
                def id = component.id
                def cache = new File(gradle.gradleUserHomeDir, "caches/modules-2/files-2.1/${id.group}/${id.module}/${id.version}")
                def binary = []
                def poms = []
                if (cache.isDirectory()) cache.eachFileRecurse { file ->
                    if (file.isFile() && (file.name.endsWith('.aar') || file.name.endsWith('.jar'))
                        && !file.name.endsWith('-sources.jar') && !file.name.endsWith('-javadoc.jar')) binary.add(file.absolutePath)
                    if (file.isFile() && file.name.endsWith('.pom')) poms.add(file.absolutePath)
                }
                def source = null
                def sourceError = null
                if (id.group != 'io.flutter') {
                    def config = app.configurations.detachedConfiguration(
                        app.dependencies.create("${id.group}:${id.module}:${id.version}:sources@jar"))
                    config.transitive = false
                    def resolved = config.incoming.artifactView { lenient = true }
                    source = resolved.files.files.find { it.name.endsWith('-sources.jar') }?.absolutePath
                    if (source == null) sourceError = 'No source artifact in configured repositories'
                }
                [coordinate: "${id.group}:${id.module}:${id.version}",
                 artifacts: binary.sort(), poms: poms.sort(), source: source, sourceError: sourceError]
            }.sort { it.coordinate }
            def lock = new File(app.rootProject.projectDir.parentFile, 'pubspec.lock')
            def sha = java.security.MessageDigest.getInstance('SHA-256').digest(lock.bytes).encodeHex().toString()
            output.text = JsonOutput.prettyPrint(JsonOutput.toJson([
                lockSha256: sha, versionName: app.android.defaultConfig.versionName,
                versionCode: app.android.defaultConfig.versionCode, components: entries])) + '\n'
            println "Release dependency inventory: ${output} (${entries.size()} artifacts)"
        }
    }
}
